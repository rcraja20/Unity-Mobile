name: Build RC Mobile Studio Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git unzip openjdk-17-jdk
          python3 -m pip install --upgrade pip scons
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmd.zip
          unzip -q /tmp/cmd.zip -d /tmp/android-tools
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          mv /tmp/android-tools/cmdline-tools/* "$HOME/android-sdk/cmdline-tools/latest/"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" platform-tools "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch Godot source
        run: git clone --depth 1 --branch 4.6-stable https://github.com/godotengine/godot.git godot
      - name: Build Android ARM64 editor
        working-directory: godot
        run: scons platform=android arch=arm64 production=yes target=editor generate_android_binaries=yes
      - name: Collect artifacts
        run: |
          mkdir -p dist
          find godot/bin -type f \( -name '*.apk' -o -name '*android*' \) -exec cp {} dist/ \; || true
          find dist -type f -print
      - name: Upload editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: rc-mobile-studio-android-arm64
          path: dist/
          if-no-files-found: error
